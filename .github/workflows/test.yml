name: test

# Runs on pushes to main and on pull requests, but only when code-relevant
# files change. Doc-only edits (README, CHANGELOG, ...) skip the matrix.
# Note: path filters apply per-file; empty-match PRs simply run no checks.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "docs/**"
      - ".gitignore"
      - "MANIFEST.in"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "docs/**"
      - ".gitignore"
      - "MANIFEST.in"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/minitelegram
      - name: Test
        run: pytest