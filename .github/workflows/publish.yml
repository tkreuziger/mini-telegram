name: publish

# Publishes the package to PyPI when a version tag (e.g. v0.1.0) is pushed.
#
# Uses PyPI's trusted publishing: no API token is stored in the repo.
# Before the first release, create the pending publisher on PyPI:
#   https://pypi.org/manage/account/publishing/
# with "GitHub" as the trusted publisher and
#   owner:        tkreuziger
#   repository:   mini-telegram
#   workflow:     publish.yml
# optionally limiting the environment to the "release" tag pattern.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for trusted publishing to PyPI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check artifacts
        run: |
          pip install twine
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: true