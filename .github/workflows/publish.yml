name: publish

# Publishes the package to PyPI when a version tag (e.g. v0.1.0) is pushed.
#
# Two authentication paths, the first wins:
#   1. API token stored as the repository secret PYPI_API_TOKEN.
#      Create a project-scoped token at https://pypi.org/manage/account/token/
#      (scope: Project: mini-telegram) and save it in
#      GitHub repo > Settings > Secrets and variables > Actions.
#   2. Trusted publishing (OIDC) fallback when the secret is absent:
#      create the pending publisher on https://pypi.org/manage/account/publishing/
#      with owner tkreuziger, repository mini-telegram, workflow publish.yml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for trusted publishing to PyPI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check artifacts
        run: |
          pip install twine
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verify-metadata: true